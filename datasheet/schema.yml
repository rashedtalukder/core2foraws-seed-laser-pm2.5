schema_version: "1.0"
device:
  name: "Seeed Studio Grove - Laser PM2.5 Sensor (HM3301)"
  scope: "Grove board carrying the HM-3301 laser dust sensor; I2C only"

source_evidence:
  verified_on: "2026-09-26"
  official_product_page: "https://wiki.seeedstudio.com/Grove-Laser_PM2.5_Sensor-HM3301/"
  product_page_capture:
    file: "Grove - Laser PM2.5 Sensor (HM3301) | Seeed Studio Wiki.pdf"
    captured: "2026-09-26 (Safari print)"
    sha256: "740e561482442b14418affbae42b952cf6740679a437729da5694cee576b3641"
    notes: "15 pages present; page footers read 'of 17'. Content after Resources/Projects is not captured."
  board_schematic:
    url: "https://files.seeedstudio.com/wiki/Grove-Laser_PM2.5_Sensor-HM3301/res/Grove%20-%20Laser%20PM2.5%20Sensor%20(HM3301).zip"
    zip_sha256: "2c230bb0d774d5a413580c9ffc569a2e5a67050e61636b3d8e5953644c083842"
    sch_file: "Grove - Laser PM2.5 Sensor(HM3301).sch"
    sch_sha256: "34a6fa50bc623293907e40f3fbe27777115155ca3abc763fc00140ef4e104efe"
    revision: "Eagle 6.4, v1.0 Initial Version, 2018-09-19"
  chip_sources:
    hm3301:
      file: "HM-3300&3600_V2.1.pdf"
      revision: "HM-3300/3600 Dust Sensor Data Sheet V2.1, released 2018-07-20"
      verified_on: "2026-09-26"
      sha256: "d9455691d292d185703f6981ffadc01dedf87cd8354218851a18f5872bc7caeb"
      official_url: "https://files.seeedstudio.com/wiki/Grove-Laser_PM2.5_Sensor-HM3301/res/HM-3300%263600_V2.1.pdf"
      notes: "Checked-in copy is byte-identical to the file linked from the Seeed wiki."
  reference_driver:
    repo: "https://github.com/Seeed-Studio/Seeed_PM2_5_sensor_HM3301"
    commit: "e3ffb82374c874f216c0fabd699b8f065e0cdc0c"
